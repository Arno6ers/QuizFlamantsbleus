<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Flamants bleus Time Machine quiz</title>
<meta name="description" content="Flamants bleus Time Machine quiz : 20 questions pour retrouver l’époque des grands moments de 1970 à 2024, classement au score et au temps.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0c12'/%3E%3Crect x='12' y='14' width='26' height='6' fill='%235aa9ff'/%3E%3Ctext x='32' y='52' text-anchor='middle' font-family='Impact,Arial' font-size='38' fill='%23f5f5f2'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
</head>
<body>
<style>:root {
  --bg: #0a0c12;
  --surface: #141416;
  --surface-2: #1c1c20;
  --line: #2c2c33;
  --line-strong: #44444d;
  --text: #f5f5f2;
  --muted: #a3a3ab;
  --accent: #5aa9ff;
  --accent-ink: #0a0c12;
  --accent-soft: rgba(90, 169, 255, 0.12);
  --bad: #ff8a2b;
  --bad-soft: rgba(255, 138, 43, 0.15);
  --radius: 16px;
  --display: "Anton", Impact, "Arial Narrow Bold", "Helvetica Neue", Arial, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, p, dl, dd, ol, ul { margin: 0; padding: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.8125rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  position: relative;
}
.screen { display: flex; flex-direction: column; gap: 16px; min-height: calc(100dvh - 40px); }

/* ───────── Boutons ───────── */
.btn {
  appearance: none;
  border: 1px solid var(--line-strong);
  background: var(--surface-2);
  border-radius: 14px;
  min-height: 52px;
  padding: 12px 18px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: transform 0.12s var(--ease), background 0.15s, border-color 0.15s, opacity 0.15s;
  touch-action: manipulation;
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
.btn-secondary { background: var(--surface); }
.btn-secondary:hover { border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); font-weight: 600; }
.btn-ghost:hover { color: var(--text); }
.btn-danger { background: var(--bad); color: #190302; border-color: var(--bad); }
.btn-small { min-height: 44px; padding: 8px 12px; font-size: 0.875rem; }
.btn-big { min-height: 64px; font-size: 1.25rem; }
.btn-sub { font-size: 0.75rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }

/* ───────── Accueil ───────── */
.home { justify-content: flex-start; gap: 20px; }
.home-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.home-foot { display: flex; justify-content: center; margin-top: auto; padding-top: 8px; }
.logo-block { padding: 28px 0 4px; }
.logo-bar { width: 72px; height: 10px; background: var(--accent); border-radius: 2px; margin-bottom: 14px; }
.logo {
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.4rem, 13vw, 5rem);
  line-height: 0.95;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}
.tagline { color: var(--muted); font-size: 1.0625rem; margin-top: 10px; max-width: 28ch; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center;
}
.stat-v { font-family: var(--display); font-size: 2rem; line-height: 1.1; color: var(--accent); }
.stat-title { font-size: 1.35rem; padding-top: 6px; }
.stat-l { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.btn-play {
  min-height: 92px;
  font-family: var(--display);
  font-weight: 400;
  font-size: 2.4rem;
  letter-spacing: 0.06em;
  border-radius: 18px;
  box-shadow: 0 10px 40px -12px rgba(90, 169, 255, 0.55);
}
.play-sub { text-align: center; margin-top: -8px; }
.home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.home-grid .btn { min-height: 68px; }

/* ───────── Jeu ───────── */
.play { gap: 14px; }
.play-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chips { display: flex; align-items: center; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line-strong); border-radius: 999px;
  padding: 6px 12px; font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--surface);
}

.streak-block { display: flex; flex-direction: column; gap: 8px; }
.streak { display: flex; align-items: baseline; gap: 12px; }
.streak-n { font-family: var(--display); font-size: 4.6rem; line-height: 0.9; color: var(--accent); display: inline-block; animation: bump 0.35s var(--ease); }
.streak-l { font-size: 0.8125rem; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
.progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.4s var(--ease); }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); letter-spacing: 0.04em; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 18px 16px 16px;
  display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 18px 40px -28px rgba(0, 0, 0, 0.9);
  animation: rise 0.28s var(--ease);
}
.card-good { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 30px -10px rgba(90, 169, 255, 0.5); }
.card-bad { border-color: var(--bad); animation: shake 0.4s; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.level { display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--accent); border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 0.875rem; letter-spacing: 0.02em; line-height: 1.2; white-space: nowrap; }
.level-stars { letter-spacing: 0.08em; font-size: 0.75rem; }
.level-1 { color: var(--accent); background: transparent; }
.level-2 { color: var(--accent); background: var(--accent-soft); }
.level-3 { color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 18px -4px rgba(90, 169, 255, 0.8); }
.sisi { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; border: 2px solid var(--accent); border-radius: 10px; padding: 7px 13px 6px; transform: rotate(3deg); color: var(--accent); line-height: 1; box-shadow: 0 0 20px -4px rgba(90, 169, 255, 0.7), inset 0 0 14px -6px rgba(90, 169, 255, 0.7); text-shadow: 0 0 10px rgba(90, 169, 255, 0.75); user-select: none; }
.sisi-top { font-family: var(--display); font-size: 1.9rem; letter-spacing: 0.04em; }
.sisi-bottom { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.16em; }
.sisi-small { padding: 4px 9px 4px; border-width: 1.5px; }
.sisi-small .sisi-top { font-size: 1.15rem; }
.sisi-small .sisi-bottom { font-size: 0.5625rem; }
.over-top { display: flex; justify-content: space-between; align-items: center; padding-top: 4px; }
.format-tag { font-size: 0.6875rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.prompt { font-size: 1.3rem; line-height: 1.25; font-weight: 800; letter-spacing: -0.005em; }
.prompt-small { font-size: 1.1rem; }

.visual { align-self: center; max-width: 100%; }
.visual-svg { width: 180px; }
.visual-svg svg { width: 100%; height: auto; display: block; border-radius: 6px; }
.visual-emoji { font-size: 4.2rem; line-height: 1.1; text-align: center; padding: 6px 0; }
.visual-img { max-height: 220px; border-radius: 12px; }
.visual-fallback { border: 1px dashed var(--line-strong); border-radius: 12px; padding: 14px; color: var(--muted); text-align: center; }

.answers { display: grid; gap: 10px; }
.answers-tf { grid-template-columns: 1fr 1fr; }
.answer {
  appearance: none; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 12px;
  min-height: 58px; padding: 12px 14px;
  background: var(--surface-2); border: 1.5px solid var(--line-strong); border-radius: 14px;
  font-weight: 650; font-size: 1.0625rem; line-height: 1.25;
  transition: transform 0.12s var(--ease), border-color 0.15s, background 0.15s, opacity 0.2s;
  touch-action: manipulation;
}
.answer:hover:not(:disabled) { border-color: var(--accent); }
.answer:active:not(:disabled) { transform: scale(0.98); }
.answer:disabled { cursor: default; }
.answer-tf { justify-content: center; min-height: 72px; font-family: var(--display); font-weight: 400; font-size: 1.7rem; letter-spacing: 0.08em; }
.answer-key {
  flex: none; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong);
  display: grid; place-items: center; font-size: 0.8125rem; font-weight: 800; color: var(--muted);
}
.answer-text { flex: 1; }
.answer-mark { flex: none; font-weight: 900; font-size: 1.25rem; }
.answer.is-correct { border-color: var(--accent); background: var(--accent-soft); animation: pop 0.3s var(--ease); }
.answer.is-correct .answer-mark { color: var(--accent); }
.answer.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.answer.is-wrong .answer-mark { color: var(--bad); }
.answer.is-dim { opacity: 0.45; }

.text-answer { display: flex; gap: 10px; }
.text-input {
  flex: 1; min-width: 0; min-height: 56px; padding: 0 14px;
  background: var(--bg); border: 1.5px solid var(--line-strong); border-radius: 14px; font-size: 1.125rem; font-weight: 600;
}
.text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.text-input.is-correct { border-color: var(--accent); }
.text-input.is-wrong { border-color: var(--bad); }
.text-submit { flex: none; min-width: 104px; }

.clue-list { list-style: none; display: grid; gap: 8px; }
.clue { display: flex; gap: 10px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; animation: rise 0.25s var(--ease); }
.clue-n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 0.8125rem; display: grid; place-items: center; }
.clue-more { align-self: flex-start; margin-top: 6px; border: 1px dashed var(--line-strong); }

.map-wrap { display: grid; gap: 10px; }
.map { width: 100%; height: auto; display: block; border-radius: 14px; border: 1px solid var(--line-strong); touch-action: manipulation; cursor: crosshair; background: #0d1114; }
.map.locked { cursor: default; }
.map-sea { fill: #0d1318; }
.map-grid { stroke: #1b242b; stroke-width: 1; }
.map-land { fill: #232a30; stroke: #3b4650; stroke-width: 1.2; stroke-linejoin: round; }
.map-label { fill: #5c6872; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; pointer-events: none; }
.map-zone { fill: rgba(90, 169, 255, 0.12); stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 5 4; }
.map-target { fill: var(--accent); stroke: #0a0c12; stroke-width: 1.5; }
.map-target-label { fill: var(--text); font-size: 14px; font-weight: 800; paint-order: stroke; stroke: #0a0c12; stroke-width: 3px; }
.pin-halo { fill: rgba(255, 255, 255, 0.2); }
.pin-dot { fill: #fff; stroke: #0a0c12; stroke-width: 1.5; }
.map-actions { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }

.feedback { min-height: 28px; }
.fb { font-weight: 700; padding: 10px 14px; border-radius: 12px; }
.fb-good { background: var(--accent-soft); color: var(--accent); }
.fb-bad { background: var(--bad-soft); color: #ffcfa0; }
.fb strong { color: var(--text); }
.explain { color: #d8d8d4; }

/* ───────── Fin de partie ───────── */
.over { gap: 16px; position: relative; }
.over-kicker { letter-spacing: 0.2em; font-size: 0.75rem; color: var(--muted); font-weight: 800; }
.over-score { text-align: center; padding: 10px 0 4px; display: grid; gap: 6px; justify-items: center; }
.over-n { font-family: var(--display); font-size: clamp(7rem, 38vw, 11rem); line-height: 0.9; color: var(--accent); animation: bump 0.5s var(--ease); }
.over-l { font-size: 1.1rem; font-weight: 700; }
.over-best { color: var(--muted); }
.over-best strong { color: var(--text); }
.over-title { font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; font-size: 0.875rem; }
.over-title .muted { text-transform: none; letter-spacing: 0; font-weight: 500; }
.record-banner {
  background: var(--accent); color: var(--accent-ink); font-family: var(--display); letter-spacing: 0.1em;
  padding: 8px 18px; border-radius: 999px; font-size: 1.15rem; animation: pop 0.5s var(--ease), glow 1.6s ease-in-out infinite;
}
.over-card { animation-delay: 0.05s; }
.chip-row { display: flex; align-items: center; gap: 10px; }
.recap { display: grid; gap: 8px; }
.recap-row { border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; }
.recap-row dt { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 800; }
.recap-row dd { font-weight: 700; font-size: 1.0625rem; }
.recap-row.bad { background: var(--bad-soft); }
.recap-row.bad dt { color: #ffcfa0; }
.recap-row.good { background: var(--accent-soft); }
.recap-row.good dt { color: var(--accent); }
.over-actions { display: grid; gap: 10px; }
.over-links { display: flex; justify-content: space-between; gap: 8px; }
.share-msg { min-height: 1.4em; text-align: center; color: var(--accent); font-size: 0.875rem; }
.share-text { width: 100%; min-height: 90px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 12px; padding: 10px; color: var(--text); }
.share-preview { width: 100%; border-radius: 12px; border: 1px solid var(--line); }

.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -16px; width: 9px; height: 16px; border-radius: 2px; animation: fall linear forwards; }
.confetti i.a { background: var(--accent); }
.confetti i.w { background: #fff; }

/* ───────── Palier / panneaux ───────── */
.milestone {
  position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 30; pointer-events: none;
  background: var(--accent); color: var(--accent-ink); border-radius: 18px; padding: 12px 24px; text-align: center;
  font-family: var(--display); font-size: 2rem; letter-spacing: 0.08em; line-height: 1.1;
  display: grid; box-shadow: 0 20px 60px -10px rgba(90, 169, 255, 0.6); animation: milestone 1.4s var(--ease) forwards;
}
.milestone small { font-family: var(--body); font-weight: 800; letter-spacing: 0.12em; font-size: 0.75rem; text-transform: uppercase; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.72); display: flex; align-items: flex-end; justify-content: center; z-index: 40; animation: fade 0.2s; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto; background: var(--surface);
  border: 1px solid var(--line-strong); border-bottom: none; border-radius: 22px 22px 0 0;
  padding: 16px 16px max(24px, env(safe-area-inset-bottom)); display: grid; gap: 14px; animation: slide 0.28s var(--ease);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { font-family: var(--display); font-weight: 400; font-size: 1.8rem; letter-spacing: 0.04em; text-transform: uppercase; }
.sheet-sub { font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.cat-stats { list-style: none; display: grid; gap: 12px; }
.cat-line { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; font-size: 0.9375rem; margin-bottom: 6px; flex-wrap: wrap; }
.cat-line .muted { font-weight: 500; font-size: 0.8125rem; }
.bar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.bar-fill { height: 100%; background: var(--accent); }
.danger-zone { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; }

/* ───────── Animations ───────── */
@keyframes bump { 0% { transform: scale(0.7); } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(0.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(90, 169, 255, 0.5); } 50% { box-shadow: 0 0 0 12px rgba(90, 169, 255, 0); } }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.9; } }
@keyframes milestone { 0% { opacity: 0; transform: translate(-50%, 16px) scale(0.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 25% { transform: translate(-50%, 0) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes slide { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

/* Réduction des animations : réglage du jeu ou préférence système */
:root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after {
  animation: none !important; transition: none !important; scroll-behavior: auto !important;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

@media (min-width: 720px) {
  .app { padding-top: 32px; }
  .screen { min-height: calc(100dvh - 64px); }
  .sheet-backdrop { align-items: center; }
  .sheet { border-radius: 22px; border-bottom: 1px solid var(--line-strong); }
}
@media (max-width: 360px) {
  .prompt { font-size: 1.15rem; }
  .streak-n { font-size: 3.8rem; }
  .answer { font-size: 1rem; }
}
.logo-sub { display: block; font-family: var(--body); font-weight: 800; font-size: clamp(0.85rem, 4.2vw, 1.15rem); letter-spacing: 0.24em; color: var(--accent); margin-top: 12px; }
.name-field { display: grid; gap: 6px; }
.hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.hud-q { display: flex; align-items: baseline; gap: 8px; }
.hud-n { font-family: var(--display); font-size: 3.6rem; line-height: 0.9; color: var(--accent); }
.hud-of { color: var(--muted); font-weight: 700; }
.hud-r { display: flex; gap: 8px; }
.hud-r .chip { font-variant-numeric: tabular-nums; }
.exact { font-size: 1.1rem; font-weight: 700; }
.exact b { color: var(--accent); font-family: var(--display); font-weight: 400; font-size: 1.4rem; letter-spacing: 0.04em; }
.year-list { list-style: none; display: grid; gap: 6px; margin-top: 6px; }
.year-list li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; font-size: 0.9375rem; }
.year-list li.is-ok { border-color: var(--accent); background: var(--accent-soft); }
.year-list b { font-variant-numeric: tabular-nums; }
.feedback { display: grid; gap: 10px; }
.learn-list { list-style: none; display: grid; gap: 10px; }

.tab { appearance: none; border: 0; background: transparent; color: var(--muted); font-weight: 700; min-height: 44px; border-radius: 10px; cursor: pointer; }

.board-row.is-me { border-color: var(--accent); background: var(--accent-soft); }
.board-pos { font-family: var(--display); font-size: 1.4rem; color: var(--accent); }
.board-name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }

.board-empty { padding: 14px; text-align: center; }
.screen.board { min-height: 0; }

/* ───────── Données ───────── */
const CATS = {
  sport: ['Sport', '⚽'], politique: ['Politique', '🏛️'], technologie: ['Technologie', '💾'],
  culture: ['Culture', '🎭'], musique: ['Musique & pop', '🎵'], cinema: ['Cinéma', '🎬'],
  litterature: ['Littérature', '📚'], jeux_tv: ['Jeux & TV', '📺'], dessins_animes: ['Dessins animés', '🐭'],
  personnalites: ['Personnalités', '⭐']
};
const CAT_KEYS = Object.keys(CATS);
const NP = 11;
const per = (y) => Math.floor((y - 1970) / 5);
const plabel = (k) => (1970 + 5 * k) + ' et ' + (1974 + 5 * k);
const ITEMS = DATA.map((d, i) => ({ id: i, cat: d[0], lvl: d[1], name: d[2], ev: d[3], year: d[4], fact: d[5], p: per(d[4]) }));
const WHICH = {
  sport: (a, b) => `Entre ${a} et ${b}, quel grand événement sportif a eu lieu ?`,
  politique: (a, b) => `Entre ${a} et ${b}, quel événement politique a marqué l’actualité ?`,
  technologie: (a, b) => `Entre ${a} et ${b}, quelle innovation est apparue ?`,
  culture: (a, b) => `Entre ${a} et ${b}, quel événement ou quel lieu culturel a vu le jour ?`,
  musique: (a, b) => `Entre ${a} et ${b}, quel grand moment de la musique a eu lieu ?`,
  cinema: (a, b) => `Entre ${a} et ${b}, quel grand film est sorti ?`,
  litterature: (a, b) => `Entre ${a} et ${b}, quel livre ou quel prix littéraire a fait parler de lui ?`,
  jeux_tv: (a, b) => `Entre ${a} et ${b}, qu’est-ce qui est apparu à la télé ou en jeu vidéo ?`,
  dessins_animes: (a, b) => `Entre ${a} et ${b}, quel dessin animé ou film d’animation est sorti ?`,
  personnalites: (a, b) => `Entre ${a} et ${b}, quel événement lié à une personnalité a eu lieu ?`
};
const STAGES = { 1: 'Échauffement', 2: 'Voyage', 3: 'Défi' };
const QN = 20;
const FORMATS = ['date', 'tf', 'date', 'which', 'date', 'tf', 'which', 'date', 'intrus', 'date',
                 'tf', 'which', 'date', 'intrus', 'which', 'date', 'tf', 'intrus', 'date', 'intrus'];
const W = { 1: { 1: 4, 2: 1, 3: 0.1 }, 2: { 1: 1.5, 2: 3, 3: 0.7 }, 3: { 1: 0.4, 2: 2, 3: 3 } };
const stageOf = (i) => (i < 7 ? 1 : i < 14 ? 2 : 3);

/* ───────── Utilitaires ───────── */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const fmtT = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtD = (t) => new Date(t).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
function rngFrom(seed) {
  let a = seed >>> 0;
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const shuffle = (r, arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
function weighted(r, arr, wf) {
  const ws = arr.map(wf); const tot = ws.reduce((a, b) => a + b, 0);
  if (!arr.length) return null;
  let x = r() * tot;
  for (let i = 0; i < arr.length; i++) { x -= ws[i]; if (x <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ───────── Stockage local ───────── */
const LSK = 'flamants-bleus-tmq:v2';
let store = { name: '', lb: [], stats: {}, recent: [], games: 0 };
function load() { try { const r = localStorage.getItem(LSK); if (r) store = Object.assign(store, JSON.parse(r)); } catch (e) { /* stockage indisponible */ } }
function save() { try { localStorage.setItem(LSK, JSON.stringify(store)); } catch (e) { /* stockage indisponible */ } }
load();

/* ───────── Génération des questions ───────── */
function yearList(items, okItem) {
  const sorted = items.slice().sort((a, b) => a.year - b.year);
  return '<ul class="year-list">' + sorted.map((x) => `<li${x === okItem ? ' class="is-ok"' : ''}><span>${esc(x.name)}</span><b>${x.year}</b></li>`).join('') + '</ul>';
}
function buildDate(r, it, stage) {
  const c = it.p; const others = []; for (let k = 0; k < NP; k++) if (k !== c) others.push(k);
  const dist = (k) => Math.abs(k - c);
  let pool = stage === 1 ? others.filter((k) => dist(k) >= 2) : stage === 2 ? others.filter((k) => dist(k) <= 4) : others.filter((k) => dist(k) <= 3);
  if (pool.length < 3) pool = others;
  const ks = [c].concat(shuffle(r, pool.slice()).slice(0, 3)).sort((a, b) => a - b);
  return {
    type: 'date', cat: it.cat, stage, chip: it.cat, items: [it],
    prompt: `À quelle période situe-t-on ${it.ev} ?`,
    options: ks.map((k) => ({ label: 'Entre ' + plabel(k), ok: k === c })),
    answer: `<p class="exact">📅 Date exacte : <b>${it.year}</b></p><p class="explain">${esc(it.fact)}</p>`,
    learn: { title: cap(it.ev), year: it.year, fact: it.fact }
  };
}
function buildTf(r, it, stage) {
  const truth = r() < 0.5; const c = it.p; let k = c;
  if (!truth) {
    const others = []; for (let j = 0; j < NP; j++) if (j !== c) others.push(j);
    const far = others.filter((j) => Math.abs(j - c) >= (stage === 1 ? 2 : 1) && Math.abs(j - c) <= 4);
    k = shuffle(r, (far.length ? far : others).slice())[0];
  }
  return {
    type: 'tf', cat: it.cat, stage, chip: it.cat, items: [it],
    prompt: `Vrai ou faux ? On situe ${it.ev}${/, /.test(it.ev) ? ',' : ''} entre ${plabel(k)}.`,
    options: [{ label: 'VRAI', ok: truth }, { label: 'FAUX', ok: !truth }],
    answer: `<p class="exact">📅 ${truth ? 'Exact, c’était en' : 'En réalité, c’était en'} <b>${it.year}</b>${truth ? '' : ' (entre ' + plabel(c) + ')'}.</p><p class="explain">${esc(it.fact)}</p>`,
    learn: { title: cap(it.ev), year: it.year, fact: it.fact }
  };
}
function buildWhich(r, it, stage, used) {
  const c = it.p;
  let pool = ITEMS.filter((x) => x.cat === it.cat && x.id !== it.id && Math.abs(x.p - c) >= 2);
  const picked = []; const names = new Set([it.name]);
  while (picked.length < 3 && pool.length) {
    const x = weighted(r, pool, (y) => W[stage][y.lvl]);
    pool = pool.filter((y) => y !== x);
    if (!names.has(x.name)) { names.add(x.name); picked.push(x); }
  }
  const all = shuffle(r, [it].concat(picked));
  return {
    type: 'which', cat: it.cat, stage, chip: it.cat, items: all,
    prompt: WHICH[it.cat](1970 + 5 * c, 1974 + 5 * c),
    options: all.map((x) => ({ label: x.name, ok: x === it })),
    answer: `<p class="exact">📅 <b>${esc(it.name)}</b> : ${it.year}</p><p class="explain">${esc(it.fact)}</p><p class="small muted">Les autres propositions :</p>${yearList(all, it)}`,
    learn: { title: it.name, year: it.year, fact: it.fact }
  };
}
function buildIntrus(r, stage, used, recent) {
  const pOpts = []; for (let k = 0; k < NP; k++) pOpts.push(k);
  const P = shuffle(r, pOpts)[0];
  let pool = ITEMS.filter((x) => x.p === P && !used.has(x.id));
  const trio = []; const cats = new Set();
  while (trio.length < 3 && pool.length) {
    let cand = pool.filter((x) => !cats.has(x.cat)); if (!cand.length) cand = pool;
    const x = weighted(r, cand, (y) => W[stage][y.lvl] * (recent.has(y.id) ? 0.2 : 1));
    pool = pool.filter((y) => y !== x); trio.push(x); cats.add(x.cat);
  }
  let outs = ITEMS.filter((x) => Math.abs(x.p - P) >= 2 && !used.has(x.id));
  const out = weighted(r, outs, (y) => W[stage][y.lvl] * (cats.has(y.cat) ? 1.5 : 1));
  trio.forEach((x) => used.add(x.id)); used.add(out.id);
  const all = shuffle(r, trio.concat([out]));
  const A = 1970 + 5 * P, B = 1974 + 5 * P;
  return {
    type: 'intrus', cat: 'intrus', stage, chip: 'intrus', items: all,
    prompt: `Trouve l’intrus : trois de ces événements ont eu lieu entre ${A} et ${B}. Lequel n’y appartient pas ?`,
    options: all.map((x) => ({ label: CATS[x.cat][1] + ' ' + x.name, ok: x === out })),
    answer: `<p class="exact">🔎 L’intrus : <b>${esc(out.name)}</b> (${out.year}).</p><p class="explain">${esc(out.fact)}</p><p class="small muted">Les trois autres sont bien de la période ${A}–${B} :</p>${yearList(all, out)}`,
    learn: { title: out.name, year: out.year, fact: out.fact }
  };
}
function genGame(seedStr, useRecent) {
  const r = rngFrom(hash(seedStr));
  const recent = new Set(useRecent ? store.recent : []);
  const used = new Set(); const qs = [];
  let seq = []; let last = null;
  for (let rep = 0; rep < 2; rep++) {
    const b = shuffle(r, CAT_KEYS.slice());
    if (last && b[0] === last) { const t = b[0]; b[0] = b[1]; b[1] = t; }
    seq = seq.concat(b); last = b[b.length - 1];
  }
  for (let i = 0; i < QN; i++) {
    const stage = stageOf(i); const f = FORMATS[i]; let q;
    if (f === 'intrus') { q = buildIntrus(r, stage, used, recent); }
    else {
      const cands = ITEMS.filter((x) => x.cat === seq[i] && !used.has(x.id));
      const it = weighted(r, cands, (x) => W[stage][x.lvl] * (recent.has(x.id) ? 0.15 : 1));
      used.add(it.id);
      q = f === 'date' ? buildDate(r, it, stage) : f === 'tf' ? buildTf(r, it, stage) : buildWhich(r, it, stage, used);
    }
    qs.push(q);
  }
  return qs;
}

/* ───────── État ───────── */
const root = document.getElementById('root');
let S = { screen: 'home', g: null, res: null, boardTab: 'mix', quitAsk: false, wipeAsk: false, msg: '' };
let timerId = null;

function startGame(mode) {
  const daily = mode === 'daily';
  const seed = daily ? 'tmq-daily-' + todayKey() : 'tmq-' + Math.random() + '-' + Date.now();
  S.g = { mode, day: daily ? todayKey() : null, qs: genGame(seed, !daily), i: 0, score: 0, ms: 0, t0: Date.now(), answered: null, log: [] };
  S.screen = 'play'; S.quitAsk = false; S.msg = '';
  render();
}
function answer(k) {
  const g = S.g; if (g.answered) return;
  const q = g.qs[g.i]; const ok = !!q.options[k].ok;
  g.ms += Date.now() - g.t0;
  if (ok) g.score++;
  g.answered = { pick: k, ok };
  g.log.push({ q, ok });
  render();
}
function next() {
  const g = S.g; if (!g.answered) return;
  if (g.i + 1 >= QN) { finish(); return; }
  g.i++; g.answered = null; g.t0 = Date.now(); render();
}
const cmp = (a, b) => b.s - a.s || a.t - b.t || a.d - b.d;
function finish() {
  const g = S.g; const name = (store.name || '').trim() || 'Joueur';
  const entry = { n: name, s: g.score, t: g.ms, d: Date.now(), m: g.mode, k: g.day };
  store.lb.push(entry); store.lb.sort(cmp); store.lb = store.lb.slice(0, 200);
  store.games = (store.games || 0) + 1;
  g.log.forEach((x) => {
    const c = x.q.type === 'intrus' ? null : x.q.cat; if (!c) return;
    const st = store.stats[c] || { ok: 0, n: 0 }; st.n++; if (x.ok) st.ok++; store.stats[c] = st;
  });
  if (g.mode !== 'daily') {
    g.qs.forEach((q) => q.items.forEach((it) => { if (q.type !== 'which' || q.options.some((o, j) => o.ok && q.items[j] === it)) store.recent.push(it.id); }));
    store.recent = store.recent.slice(-140);
  }
  save();
  const same = store.lb.filter((e) => e.m === g.mode && (g.mode !== 'daily' || e.k === g.day));
  const pos = same.indexOf(entry) + 1;
  const prev = store.lb.filter((e) => e !== entry && e.m === g.mode);
  const bestPrev = prev.sort(cmp)[0];
  S.res = { score: g.score, ms: g.ms, pos, total: same.length, entry, record: !bestPrev || cmp(entry, bestPrev) < 0, wrong: g.log.filter((x) => !x.ok).map((x) => x.q.learn), mode: g.mode };
  S.screen = 'result'; S.g = null; render();
}
const titleFor = (s) => s >= 20 ? 'Légende des siècles' : s >= 16 ? 'Maître du temps' : s >= 11 ? 'Chrononaute' : s >= 6 ? 'Voyageur' : 'Apprenti du temps';

/* ───────── Vues ───────── */
const logoBadge = (small) => `<div class="sisi${small ? ' sisi-small' : ''}" aria-hidden="true"><span class="sisi-top">time</span><span class="sisi-bottom">machine</span></div>`;
function homeView() {
  const best = store.lb.filter((e) => e.m === 'mix').sort(cmp)[0];
  const tot = Object.values(store.stats).reduce((a, s) => a + s.n, 0); const ok = Object.values(store.stats).reduce((a, s) => a + s.ok, 0);
  return `<main class="screen home">
    <div class="home-top"><span class="muted small">${ITEMS.length} événements · 1970–2024</span>${logoBadge(true)}</div>
    <div class="logo-block"><div class="logo-bar"></div>
      <h1 class="logo">FLAMANTS BLEUS<span class="logo-sub">Time Machine quiz</span></h1>
      <p class="tagline">Remonte le temps de 1970 à 2024 : retrouve l’époque des grands moments, et enrichis ta culture au fil des parties.</p></div>
    <div class="stat-row">
      <div class="stat"><span class="stat-v">${best ? best.s + '/20' : '–'}</span><span class="stat-l">Record</span></div>
      <div class="stat"><span class="stat-v">${store.games || 0}</span><span class="stat-l">Parties</span></div>
      <div class="stat"><span class="stat-v">${tot ? Math.round(100 * ok / tot) + '%' : '–'}</span><span class="stat-l">Réussite</span></div>
    </div>
    <label class="name-field" for="name"><span class="stat-l">Ton prénom pour le classement</span>
      <input id="name" class="text-input" maxlength="16" autocomplete="off" placeholder="Prénom" value="${esc(store.name || '')}"></label>
    <button class="btn btn-primary btn-play" data-act="start" data-mode="mix">JOUER</button>
    <p class="muted small play-sub">20 questions · 3 étapes de plus en plus difficiles · classement au score, puis au temps</p>
    <div class="home-grid">
      <button class="btn btn-secondary" data-act="start" data-mode="daily">Défi du jour<span class="btn-sub">Mêmes 20 questions pour tous</span></button>
      <button class="btn btn-secondary" data-act="board">Classement<span class="btn-sub">Scores, temps, progrès</span></button>
    </div>
  </main>`;
}
function playView() {
  const g = S.g; const q = g.qs[g.i]; const a = g.answered;
  const catLabel = q.chip === 'intrus' ? '🔎 Trouve l’intrus' : CATS[q.cat][1] + ' ' + CATS[q.cat][0];
  const stars = '●'.repeat(q.stage) + '○'.repeat(3 - q.stage);
  const opts = q.options.map((o, k) => {
    let cls = 'answer' + (q.type === 'tf' ? ' answer-tf' : ''); let mark = '';
    if (a) { if (o.ok) { cls += ' is-correct'; mark = '✓'; } else if (a.pick === k) { cls += ' is-wrong'; mark = '✕'; } else cls += ' is-dim'; }
    return `<button class="${cls}" data-act="ans" data-k="${k}"${a ? ' disabled' : ''}>${q.type === 'tf' ? '' : `<span class="answer-key">${'ABCD'[k]}</span>`}<span class="answer-text">${esc(o.label)}</span><span class="answer-mark">${mark}</span></button>`;
  }).join('');
  const fb = a ? `<div class="feedback"><div class="fb ${a.ok ? 'fb-good' : 'fb-bad'}"><strong>${a.ok ? ['Bien joué !', 'Exact !', 'Bravo !', 'Bonne réponse !'][g.i % 4] : 'Raté, mais tu l’as appris !'}</strong></div>${q.answer}</div>
    <button class="btn btn-primary btn-big" id="next" data-act="next">${g.i + 1 >= QN ? 'Voir mon résultat' : 'Question suivante'}</button>` : '';
  const total = g.ms + (a ? 0 : Date.now() - g.t0);
  return `<main class="screen play">
    <div class="play-head">
      <button class="btn btn-ghost btn-small" data-act="quit">${S.quitAsk ? 'Abandonner la partie ?' : '✕ Quitter'}</button>
      ${S.quitAsk ? '<button class="btn btn-ghost btn-small" data-act="quitno">Continuer</button>' : `<span class="chip">${esc(catLabel)}</span>`}
    </div>
    <div class="hud">
      <div class="hud-q"><span class="hud-n">${g.i + 1}</span><span class="hud-of">/ ${QN}</span></div>
      <div class="hud-r"><span class="chip">★ ${g.score}</span><span class="chip" id="timer">⏱ ${fmtT(total)}</span></div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="${QN}" aria-valuenow="${g.i + (a ? 1 : 0)}"><div class="progress-fill" style="width:${100 * (g.i + (a ? 1 : 0)) / QN}%"></div></div>
    <div class="progress-meta"><span>Étape ${q.stage} · ${STAGES[q.stage]}</span><span>${a ? '' : 'Choisis une réponse'}</span></div>
    <section class="card${a ? (a.ok ? ' card-good' : ' card-bad') : ''}" aria-live="polite">
      <div class="card-top"><span class="format-tag">${q.type === 'date' ? 'Quelle période ?' : q.type === 'tf' ? 'Vrai ou faux' : q.type === 'which' ? 'Quel grand moment ?' : 'Trouve l’intrus'}</span><span class="level level-${q.stage}"><span class="level-stars">${stars}</span>${STAGES[q.stage]}</span></div>
      <h2 class="prompt">${esc(q.prompt)}</h2>
      <div class="answers${q.type === 'tf' ? ' answers-tf' : ''}">${opts}</div>
      ${fb}
    </section>
  </main>`;
}
function resultView() {
  const R = S.res; const t = titleFor(R.score);
  const wrong = R.wrong.length ? `<section class="card over-card"><h2 class="over-title">À retenir <span class="muted">· ${R.wrong.length} date${R.wrong.length > 1 ? 's' : ''} à revoir</span></h2><ul class="learn-list">${R.wrong.map((w) => `<li><b>${w.year}</b><span>${esc(w.title)}<small>${esc(w.fact)}</small></span></li>`).join('')}</ul></section>`
    : `<section class="card over-card"><h2 class="over-title">Sans-faute !</h2><p class="explain">Tu connais ton histoire récente sur le bout des doigts. Retente le défi du jour ou essaie de faire mieux au chrono.</p></section>`;
  return `<main class="screen over">
    <div class="over-top"><span class="over-kicker">${R.mode === 'daily' ? 'DÉFI DU JOUR' : 'PARTIE TERMINÉE'}</span>${logoBadge(true)}</div>
    <div class="over-score"><div class="over-n">${R.score}<span class="over-of">/20</span></div>
      <div class="over-l">${esc(t)}</div>
      <p class="over-best">Temps : <strong>${fmtT(R.ms)}</strong> · <strong>${R.pos}${R.pos === 1 ? 'er' : 'e'}</strong> sur ${R.total} au classement ${R.mode === 'daily' ? 'du jour' : 'général'}</p>
      ${R.record ? '<div class="record-banner">NOUVEAU RECORD</div>' : ''}
    </div>
    ${wrong}
    <div class="over-actions">
      <button class="btn btn-primary btn-big" data-act="start" data-mode="${R.mode}">${R.mode === 'daily' ? 'Rejouer le défi' : 'Rejouer'}</button>
      <button class="btn btn-secondary" data-act="share">Copier mon résultat</button>
      <p class="share-msg" role="status">${esc(S.msg)}</p>
      <div class="over-links"><button class="btn btn-ghost btn-small" data-act="board">Classement</button><button class="btn btn-ghost btn-small" data-act="home">Accueil</button></div>
    </div>
  </main>`;
}
function boardView() {
  const tab = S.boardTab; const day = todayKey();
  const list = store.lb.filter((e) => e.m === tab && (tab !== 'daily' || e.k === day)).sort(cmp).slice(0, 20);
  const rows = list.length ? list.map((e, i) => `<li class="board-row${S.res && S.res.entry === e ? ' is-me' : ''}"><span class="board-pos">${i + 1}</span><span class="board-name">${esc(e.n)}<small>${fmtD(e.d)}</small></span><span class="board-score">${e.s}<small>/20</small></span><span class="board-time">${fmtT(e.t)}</span></li>`).join('')
    : `<li class="board-empty muted">${tab === 'daily' ? 'Personne n’a encore relevé le défi du jour sur cet appareil.' : 'Aucune partie pour l’instant. Lance-toi !'}</li>`;
  const stats = CAT_KEYS.map((c) => { const s = store.stats[c] || { ok: 0, n: 0 }; const pc = s.n ? Math.round(100 * s.ok / s.n) : 0; return `<li><div class="cat-line"><span>${CATS[c][1]} ${CATS[c][0]}</span><span class="muted">${s.n ? pc + ' % · ' + s.ok + '/' + s.n : 'pas encore joué'}</span></div><div class="bar"><div class="bar-fill" style="width:${pc}%"></div></div></li>`; }).join('');
  return `<main class="screen board">
    <div class="play-head"><button class="btn btn-ghost btn-small" data-act="home">← Accueil</button>${logoBadge(true)}</div>
    <h2 class="sheet-title">Classement</h2>
    <p class="muted small">Classé d’abord par score, puis par temps total de réflexion (le plus court gagne). Les scores sont enregistrés sur cet appareil.</p>
    <div class="tabs" role="tablist"><button class="tab${tab === 'mix' ? ' is-on' : ''}" data-act="tab" data-tab="mix" role="tab">Général</button><button class="tab${tab === 'daily' ? ' is-on' : ''}" data-act="tab" data-tab="daily" role="tab">Défi du jour</button></div>
    <ol class="board-list">${rows}</ol>
    <h3 class="sheet-sub">Mes progrès par thème</h3>
    <ul class="cat-stats">${stats}</ul>
    <div class="danger-zone">${S.wipeAsk ? '<span class="small">Tout effacer (scores et progrès) ?</span><button class="btn btn-danger btn-small" data-act="wipeyes">Oui, effacer</button><button class="btn btn-ghost btn-small" data-act="wipeno">Annuler</button>' : '<button class="btn btn-ghost btn-small" data-act="wipe">Effacer mes données</button>'}</div>
  </main>`;
}

function render() {
  root.innerHTML = S.screen === 'home' ? homeView() : S.screen === 'play' ? playView() : S.screen === 'result' ? resultView() : boardView();
  window.scrollTo(0, 0);
  if (S.screen === 'play' && S.g.answered) { const n = document.getElementById('next'); if (n) { n.focus({ preventScroll: true }); n.scrollIntoView({ block: 'nearest' }); } }
}
function shareText() {
  const R = S.res;
  return `Flamants bleus Time Machine quiz : ${R.score}/20 en ${fmtT(R.ms)} (${titleFor(R.score)}). Tu peux faire mieux ? ${location.href.split('#')[0]}`;
}
root.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') startGame(el.dataset.mode);
  else if (act === 'ans') answer(+el.dataset.k);
  else if (act === 'next') next();
  else if (act === 'home') { S.screen = 'home'; S.wipeAsk = false; render(); }
  else if (act === 'board') { S.screen = 'board'; S.wipeAsk = false; render(); }
  else if (act === 'tab') { S.boardTab = el.dataset.tab; render(); }
  else if (act === 'quit') { if (S.quitAsk) { S.g = null; S.screen = 'home'; S.quitAsk = false; render(); } else { S.quitAsk = true; render(); } }
  else if (act === 'quitno') { S.quitAsk = false; render(); }
  else if (act === 'wipe') { S.wipeAsk = true; render(); }
  else if (act === 'wipeno') { S.wipeAsk = false; render(); }
  else if (act === 'wipeyes') { store = { name: store.name, lb: [], stats: {}, recent: [], games: 0 }; save(); S.wipeAsk = false; S.res = null; render(); }
  else if (act === 'share') {
    const txt = shareText();
    const done = (m) => { S.msg = m; const n = root.querySelector('.share-msg'); if (n) n.textContent = m; };
    if (navigator.share) { navigator.share({ text: txt }).then(() => done('Résultat partagé.')).catch(() => done('')); }
    else if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(() => done('Résultat copié.')).catch(() => done(txt)); }
    else done(txt);
  }
});
root.addEventListener('input', (ev) => { if (ev.target.id === 'name') { store.name = ev.target.value.slice(0, 16); save(); } });
timerId = setInterval(() => {
  if (S.screen !== 'play' || !S.g || S.g.answered) return;
  const t = document.getElementById('timer'); if (t) t.textContent = '⏱ ' + fmtT(S.g.ms + Date.now() - S.g.t0);
}, 500);
render();
})();

</script>
</body>
</html>
